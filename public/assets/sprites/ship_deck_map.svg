<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="hullMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="800" height="600" fill="url(#spaceBg)"/>

  <!-- Outer Ship Hull Silhouette -->
  <polygon points="400,20 620,130 680,480 560,570 240,570 120,480 180,130" fill="url(#hullMetal)" stroke="#0ea5e9" stroke-width="4"/>

  <!-- Central Corridor Hub -->
  <rect x="340" y="240" width="120" height="120" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="400" cy="300" r="25" fill="none" stroke="#38bdf8" stroke-dasharray="4" stroke-width="2"/>
  <text x="400" y="305" font-family="monospace" font-size="12" fill="#38bdf8" text-anchor="middle">HUB</text>

  <!-- 1. COCKPIT (Top) -->
  <rect x="260" y="50" width="280" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
  <path d="M 280 65 Q 400 35 520 65" stroke="#93c5fd" stroke-width="6" fill="none"/>
  <rect x="360" y="110" width="80" height="40" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="135" font-family="sans-serif" font-weight="bold" font-size="14" fill="#93c5fd" text-anchor="middle">COCKPIT</text>
  <text x="400" y="180" font-family="monospace" font-size="11" fill="#60a5fa" text-anchor="middle">[Commander: Helm]</text>

  <!-- 2. SCIENCE LAB (Left) -->
  <rect x="150" y="210" width="160" height="180" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="3"/>
  <circle cx="190" cy="260" r="14" fill="#047857" stroke="#34d399" stroke-width="2"/>
  <circle cx="190" cy="310" r="14" fill="#047857" stroke="#34d399" stroke-width="2"/>
  <text x="230" y="295" font-family="sans-serif" font-weight="bold" font-size="13" fill="#a7f3d0" text-anchor="middle">SCIENCE</text>
  <text x="230" y="315" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">LAB / O2</text>

  <!-- 3. CAPCOM / AVIONICS (Right) -->
  <rect x="490" y="210" width="160" height="180" rx="8" fill="#0c4a6e" stroke="#06b6d4" stroke-width="3"/>
  <rect x="520" y="250" width="100" height="50" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
  <text x="570" y="280" font-family="sans-serif" font-weight="bold" font-size="13" fill="#bae6fd" text-anchor="middle">CAPCOM</text>
  <text x="570" y="335" font-family="monospace" font-size="10" fill="#7dd3fc" text-anchor="middle">[Power Grid]</text>

  <!-- 4. ENGINE BAY (Bottom) -->
  <rect x="250" y="400" width="300" height="150" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="3"/>
  <circle cx="400" cy="465" r="32" fill="#7f1d1d" stroke="#f87171" stroke-width="3"/>
  <circle cx="400" cy="465" r="14" fill="#ef4444"/>
  <text x="400" y="525" font-family="sans-serif" font-weight="bold" font-size="14" fill="#fca5a5" text-anchor="middle">ENGINE ROOM</text>
  <text x="400" y="542" font-family="monospace" font-size="11" fill="#f87171" text-anchor="middle">[Engineer: Core & Valves]</text>

  <!-- Connecting Bulkhead Airlocks -->
  <rect x="385" y="200" width="30" height="40" fill="#64748b" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="310" y="285" width="30" height="30" fill="#64748b" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="460" y="285" width="30" height="30" fill="#64748b" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="385" y="360" width="30" height="40" fill="#64748b" stroke="#e2e8f0" stroke-width="2"/>
</svg>
